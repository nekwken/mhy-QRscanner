[workspace]
resolver = "2"
members = [
    "crates/mhy-qrscanner-core",
    "crates/mhy-qrscanner-device",
    "crates/mhy-qrscanner-mihoyo",
    "crates/mhy-qrscanner-qr",
    "crates/mhy-qrscanner-capture",
    "crates/mhy-qrscanner-live",
    "crates/mhy-qrscanner-bridge",
    "crates/mhy-qrscanner-store",
    "crates/mhy-qrscanner-cli",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
directories = "5"
md-5 = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
winapi = { version = "0.3", features = ["dpapi", "wincrypt", "winbase"] }
zeroize = "1"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
