[package]
name = "mhy-qrscanner-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mhyqr"
path = "src/main.rs"

[dependencies]
mhy-qrscanner-core = { path = "../mhy-qrscanner-core" }
mhy-qrscanner-device = { path = "../mhy-qrscanner-device" }
mhy-qrscanner-mihoyo = { path = "../mhy-qrscanner-mihoyo" }
mhy-qrscanner-qr = { path = "../mhy-qrscanner-qr" }
mhy-qrscanner-capture = { path = "../mhy-qrscanner-capture" }
mhy-qrscanner-store = { path = "../mhy-qrscanner-store" }
mhy-qrscanner-live = { path = "../mhy-qrscanner-live" }
image = { version = "0.25", default-features = false }
reqwest = { workspace = true, features = ["blocking"] }
anyhow.workspace = true
clap.workspace = true
directories.workspace = true
rand.workspace = true
tokio.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
