[package]
name = "mhy-qrscanner-bridge"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cdylib for the Flutter FFI boundary; lib keeps the crate unit-testable.
[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
directories.workspace = true
flutter_rust_bridge = "=2.13.0"
mhy-qrscanner-capture = { path = "../mhy-qrscanner-capture" }
mhy-qrscanner-core = { path = "../mhy-qrscanner-core" }
mhy-qrscanner-live = { path = "../mhy-qrscanner-live" }
image = "0.25"
reqwest = { workspace = true, features = ["blocking"] }
mhy-qrscanner-device = { path = "../mhy-qrscanner-device" }
mhy-qrscanner-mihoyo = { path = "../mhy-qrscanner-mihoyo" }
mhy-qrscanner-qr = { path = "../mhy-qrscanner-qr" }
mhy-qrscanner-store = { path = "../mhy-qrscanner-store" }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

# `frb_generated.rs` uses this cfg while expanding macros during codegen.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
